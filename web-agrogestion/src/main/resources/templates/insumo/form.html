<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Insumo', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina" th:text="${insumo['id'] != null} ? 'Editar insumo' : 'Nuevo insumo'">Insumo</h1>
            <p class="subtitulo-pagina">Los valores no pueden ser negativos. Después de crearlo, el stock solo cambia con entradas y salidas.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/insumos}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <form class="tarjeta tarjeta-cuerpo" method="post" th:action="${insumo['id'] != null} ? @{/insumos/{id}(id=${insumo['id']})} : @{/insumos}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="nombre">Nombre</label>
                <input class="form-control" id="nombre" name="nombre" required placeholder="Ej.: Urea 46%" th:value="${insumo['nombre']}">
            </div>
            <div class="col-md-3">
                <label class="form-label campo-requerido" for="categoria">Categoría</label>
                <select class="form-select" id="categoria" name="categoria" required>
                    <option value="" disabled th:selected="${insumo['categoria'] == null}">Seleccione</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="#{${'categoria.' + c}}" th:selected="${c == insumo['categoria']}">Categoría</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label campo-requerido" for="unidadMedida">Unidad de medida</label>
                <input class="form-control" id="unidadMedida" name="unidadMedida" list="unidades" required th:value="${insumo['unidadMedida']}">
                <datalist id="unidades"><option th:each="u : ${unidades}" th:value="${u}"></option></datalist>
            </div>
            <div class="col-md-3" th:if="${insumo['id'] == null}">
                <label class="form-label" for="stockActual">Stock inicial</label>
                <input type="number" class="form-control" id="stockActual" name="stockActual" min="0" step="0.01" th:value="${insumo['stockActual']}">
            </div>
            <div class="col-md-3" th:unless="${insumo['id'] == null}">
                <label class="form-label">Stock actual</label>
                <input class="form-control" disabled th:value="${insumo['stockActual']}">
                <div class="form-text">Use entradas y salidas para cambiarlo.</div>
            </div>
            <div class="col-md-3">
                <label class="form-label campo-requerido" for="stockMinimo">Stock mínimo</label>
                <input type="number" class="form-control" id="stockMinimo" name="stockMinimo" min="0" step="0.01" required th:value="${insumo['stockMinimo']}">
            </div>
            <div class="col-md-3">
                <label class="form-label campo-requerido" for="costoUnitario">Costo unitario ($)</label>
                <input type="number" class="form-control" id="costoUnitario" name="costoUnitario" min="0" step="1" required th:value="${insumo['costoUnitario']}">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="proveedorId">Proveedor</label>
                <select class="form-select" id="proveedorId" name="proveedorId">
                    <option value="">Sin proveedor</option>
                    <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${p.id == insumo['proveedorId']}">Proveedor</option>
                </select>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/insumos}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Guardar insumo</button>
        </div>
    </form>
</section>
</body>
</html>
