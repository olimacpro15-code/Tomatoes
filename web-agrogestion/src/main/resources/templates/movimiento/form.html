<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Movimiento', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina" th:text="${tipo == 'ENTRADA'} ? 'Registrar entrada' : 'Registrar salida'">Movimiento</h1>
            <p class="subtitulo-pagina" th:text="${tipo == 'ENTRADA'} ? 'Compra o ingreso de insumo: la cantidad se suma al stock automáticamente.' : 'Entrega de insumo a campo: se valida que haya existencias suficientes y la cantidad se resta del stock.'">Ayuda</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/movimientos}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <form class="tarjeta tarjeta-cuerpo" style="max-width: 720px" method="post" th:action="@{/movimientos/{t}(t=${#strings.toLowerCase(tipo)})}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label campo-requerido" for="insumoId">Insumo</label>
                <select class="form-select" id="insumoId" name="insumoId" required>
                    <option value="" disabled th:selected="${form['insumoId'] == null}">Seleccione un insumo</option>
                    <option th:each="i : ${insumos}" th:value="${i.id}"
                            th:text="${i.nombre + ' (stock: ' + #numbers.formatDecimal(i.stockActual, 1, 'POINT', 2, 'COMMA') + ' ' + i.unidadMedida + ')'}"
                            th:selected="${i.id == form['insumoId']}">Insumo</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label campo-requerido" for="cantidad">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" name="cantidad" min="0.01" step="0.01" required th:value="${form['cantidad']}">
            </div>
            <div class="col-12">
                <label class="form-label" for="observacion" th:text="${tipo == 'ENTRADA'} ? 'Observación (proveedor, factura, etc.)' : 'Observación (a quién o a qué lote se entrega)'">Observación</label>
                <textarea class="form-control" id="observacion" name="observacion" rows="2" maxlength="300" th:text="${form['observacion']}"></textarea>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/movimientos}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i><span th:text="${tipo == 'ENTRADA'} ? 'Registrar entrada' : 'Registrar salida'">Registrar</span></button>
        </div>
    </form>
</section>
</body>
</html>
