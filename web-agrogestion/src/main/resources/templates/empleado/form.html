<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Empleado', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina" th:text="${empleado['id'] != null} ? 'Editar empleado' : 'Nuevo empleado'">Empleado</h1>
            <p class="subtitulo-pagina">El documento y el correo no pueden repetirse. El correo es el usuario para iniciar sesión.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/empleados}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>

    <form class="tarjeta tarjeta-cuerpo" method="post"
          th:action="${empleado['id'] != null} ? @{/empleados/{id}(id=${empleado['id']})} : @{/empleados}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="nombres">Nombres</label>
                <input class="form-control" id="nombres" name="nombres" maxlength="80" required th:value="${empleado['nombres']}">
            </div>
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="apellidos">Apellidos</label>
                <input class="form-control" id="apellidos" name="apellidos" maxlength="80" required th:value="${empleado['apellidos']}">
            </div>
            <div class="col-md-4">
                <label class="form-label campo-requerido" for="documento">Documento</label>
                <input class="form-control" id="documento" name="documento" minlength="5" maxlength="20" required th:value="${empleado['documento']}">
            </div>
            <div class="col-md-8">
                <label class="form-label campo-requerido" for="correo">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" required th:value="${empleado['correo']}">
            </div>
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="cargo">Cargo</label>
                <input class="form-control" id="cargo" name="cargo" required placeholder="Ej.: Operario de campo" th:value="${empleado['cargo']}">
            </div>
            <div class="col-md-3">
                <label class="form-label campo-requerido" for="rol">Rol en el sistema</label>
                <select class="form-select" id="rol" name="rol" required>
                    <option value="" disabled th:selected="${empleado['rol'] == null}">Seleccione</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="#{${'rol.' + r}}" th:selected="${r == empleado['rol']}">Rol</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="fechaIngreso">Fecha de ingreso</label>
                <input type="date" class="form-control" id="fechaIngreso" name="fechaIngreso" th:value="${empleado['fechaIngreso']}">
            </div>
            <div class="col-md-6">
                <label class="form-label" th:classappend="${empleado['id'] == null} ? 'campo-requerido'" for="password">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="60" autocomplete="new-password"
                           th:required="${empleado['id'] == null}">
                    <button class="btn btn-outline-secondary" type="button" data-ver-clave="#password" aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <div class="form-text" th:text="${empleado['id'] != null} ? 'Déjela vacía para conservar la contraseña actual.' : 'Mínimo 8 caracteres. Se guarda cifrada.'">Ayuda</div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/empleados}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Guardar empleado</button>
        </div>
    </form>
</section>
</body>
</html>
