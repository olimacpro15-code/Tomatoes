<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Empleados', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina">Empleados</h1>
            <p class="subtitulo-pagina">Personal de la empresa, su cargo y su rol en el sistema.</p>
        </div>
        <div class="acciones" sec:authorize="hasRole('ADMINISTRADOR')">
            <a class="btn btn-outline-secondary" th:href="@{/roles}"><i class="bi bi-shield-check me-1"></i>Roles y permisos</a>
            <a class="btn btn-primary" th:href="@{/empleados/nuevo}"><i class="bi bi-person-plus me-1"></i>Nuevo empleado</a>
        </div>
    </div>

    <div class="tarjeta">
        <div class="tarjeta-cabecera no-imprimir">
            <form method="get" th:action="@{/empleados}">
                <select name="estado" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="Filtrar por estado">
                    <option value="" th:selected="${estadoSel == ''}">Todos los estados</option>
                    <option value="ACTIVO" th:selected="${estadoSel == 'ACTIVO'}">Solo activos</option>
                    <option value="INACTIVO" th:selected="${estadoSel == 'INACTIVO'}">Solo inactivos</option>
                </select>
            </form>
            <input type="search" class="form-control form-control-sm" style="max-width: 280px" placeholder="Buscar por nombre, documento o correo" data-filtro="#tablaEmpleados">
        </div>

        <th:block th:if="${#lists.isEmpty(empleados)}"><div th:replace="~{fragments/componentes :: vacio('Sin empleados', 'No hay empleados con este filtro.')}"></div></th:block>
        <div class="tabla-responsive" th:unless="${#lists.isEmpty(empleados)}">
            <table class="tabla" id="tablaEmpleados">
                <thead>
                <tr>
                    <th>Empleado</th><th>Documento</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Ingreso</th>
                    <th sec:authorize="hasRole('ADMINISTRADOR')"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empleados}" th:classappend="${e.estado == 'INACTIVO'} ? 'fila-inactiva'">
                    <td class="nombre-celda"><strong th:text="${e.nombres + ' ' + e.apellidos}">Nombre</strong><small th:text="${e.cargo}">Cargo</small></td>
                    <td th:text="${e.documento}">0000</td>
                    <td th:text="${e.correo}">correo</td>
                    <td><span th:replace="~{fragments/componentes :: rol(${e.rol})}"></span></td>
                    <td><span th:replace="~{fragments/componentes :: estado(${e.estado})}"></span></td>
                    <td th:text="${e.fechaIngreso}">fecha</td>
                    <td class="celda-acciones" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="btn btn-outline-secondary btn-sm btn-icono" th:href="@{/empleados/{id}/editar(id=${e.id})}" title="Editar" aria-label="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:if="${e.estado == 'ACTIVO'}" th:action="@{/empleados/{id}/desactivar(id=${e.id})}" method="post"
                              data-confirmar="¿Desactivar este empleado? Ya no podrá iniciar sesión, pero se conserva su historial.">
                            <button class="btn btn-outline-danger btn-sm btn-icono" title="Desactivar" aria-label="Desactivar"><i class="bi bi-person-x"></i></button>
                        </form>
                        <form th:unless="${e.estado == 'ACTIVO'}" th:action="@{/empleados/{id}/activar(id=${e.id})}" method="post">
                            <button class="btn btn-outline-secondary btn-sm btn-icono" title="Reactivar" aria-label="Reactivar"><i class="bi bi-person-check"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
