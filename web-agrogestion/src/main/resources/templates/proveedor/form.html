<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Proveedor', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina" th:text="${proveedor['id'] != null} ? 'Editar proveedor' : 'Nuevo proveedor'">Proveedor</h1>
            <p class="subtitulo-pagina">El NIT no puede repetirse.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/proveedores}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <form class="tarjeta tarjeta-cuerpo" method="post" th:action="${proveedor['id'] != null} ? @{/proveedores/{id}(id=${proveedor['id']})} : @{/proveedores}">
        <div class="row g-3">
            <div class="col-md-7">
                <label class="form-label campo-requerido" for="nombre">Nombre o razón social</label>
                <input class="form-control" id="nombre" name="nombre" required th:value="${proveedor['nombre']}">
            </div>
            <div class="col-md-5">
                <label class="form-label campo-requerido" for="nit">NIT</label>
                <input class="form-control" id="nit" name="nit" required placeholder="900123456-7" th:value="${proveedor['nit']}">
            </div>
            <div class="col-md-5">
                <label class="form-label" for="telefono">Teléfono</label>
                <input class="form-control" id="telefono" name="telefono" th:value="${proveedor['telefono']}">
            </div>
            <div class="col-md-7">
                <label class="form-label" for="correo">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" th:value="${proveedor['correo']}">
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/proveedores}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Guardar proveedor</button>
        </div>
    </form>
</section>
</body>
</html>
