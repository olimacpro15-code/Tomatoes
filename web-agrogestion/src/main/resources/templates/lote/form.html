<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Lote', ~{::section})}">
<body>
<section>
    <div class="pagina-encabezado">
        <div>
            <h1 class="titulo-pagina" th:text="${lote['id'] != null} ? 'Editar lote' : 'Nuevo lote'">Lote</h1>
            <p class="subtitulo-pagina">El nombre del lote debe ser único.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/lotes}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>
    <form class="tarjeta tarjeta-cuerpo" method="post" th:action="${lote['id'] != null} ? @{/lotes/{id}(id=${lote['id']})} : @{/lotes}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="nombre">Nombre del lote</label>
                <input class="form-control" id="nombre" name="nombre" required placeholder="Ej.: Lote Norte 1" th:value="${lote['nombre']}">
            </div>
            <div class="col-md-6">
                <label class="form-label campo-requerido" for="cultivo">Cultivo</label>
                <input class="form-control" id="cultivo" name="cultivo" required placeholder="Ej.: Tomate chonto" th:value="${lote['cultivo']}">
            </div>
            <div class="col-md-8">
                <label class="form-label campo-requerido" for="ubicacion">Ubicación</label>
                <input class="form-control" id="ubicacion" name="ubicacion" required placeholder="Vereda, finca o coordenadas" th:value="${lote['ubicacion']}">
            </div>
            <div class="col-md-4">
                <label class="form-label campo-requerido" for="areaHectareas">Área (hectáreas)</label>
                <input type="number" class="form-control" id="areaHectareas" name="areaHectareas" min="0.01" step="0.01" required th:value="${lote['areaHectareas']}">
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/lotes}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Guardar lote</button>
        </div>
    </form>
</section>
</body>
</html>
