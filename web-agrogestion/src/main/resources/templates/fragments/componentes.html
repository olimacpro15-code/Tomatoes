<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Recursos comunes: tipografías, Bootstrap 5, iconos y hoja de estilos propia -->
<th:block th:fragment="recursos">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tomatoes.css}">
</th:block>

<!-- Elemento del menú lateral -->
<a th:fragment="item(url, icono, texto)" th:href="@{${url}}" class="nav-item-t"
   th:classappend="${rutaActual != null and (rutaActual == url or (rutaActual.startsWith(url + '/') and !rutaActual.contains('stock-bajo')))} ? 'activo'">
    <i th:class="'bi bi-' + ${icono}"></i><span th:text="${texto}">Opción</span>
</a>

<!-- Tarjeta de módulo para la pantalla de inicio -->
<div th:fragment="modulo(url, icono, titulo, texto)" class="col-sm-6 col-xl-4">
    <a th:href="@{${url}}" class="tarjeta tarjeta-cuerpo d-block h-100 modulo">
        <span class="icono"><i th:class="'bi bi-' + ${icono}"></i></span>
        <h3 th:text="${titulo}">Módulo</h3>
        <p class="mb-0" th:text="${texto}">Descripción</p>
    </a>
</div>

<!-- Mensajes: éxito, error (con detalle por campo) y avisos de servicios caídos -->
<th:block th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alerta-flash d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}">Hecho</span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <div class="d-flex align-items-start">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <div>
                <span th:text="${error}">Error</span>
                <ul th:if="${errores != null and !errores.isEmpty()}">
                    <li th:each="e : ${errores}" th:text="${e.value}">Detalle</li>
                </ul>
            </div>
        </div>
    </div>
    <div th:each="a : ${avisos}" class="alert alert-warning d-flex align-items-center" role="alert">
        <i class="bi bi-cloud-slash me-2"></i><span th:text="${a}">Aviso</span>
    </div>
</th:block>

<!-- Insignias -->
<span th:fragment="estado(valor)" th:if="${valor != null}" class="badge-t"
      th:classappend="'b-' + ${#strings.toLowerCase(valor)}" th:text="#{${'estado.' + valor}}">Activo</span>
<span th:fragment="rol(valor)" th:if="${valor != null}" class="badge-t"
      th:classappend="'b-' + ${#strings.toLowerCase(valor)}" th:text="#{${'rol.' + valor}}">Rol</span>

<!-- Estado vacío -->
<div th:fragment="vacio(titulo, texto)" class="vacio">
    <img th:src="@{/img/brote.svg}" alt="">
    <h3 th:text="${titulo}">Sin registros</h3>
    <p class="mb-0" th:text="${texto}">Aún no hay información.</p>
</div>

</body>
</html>
