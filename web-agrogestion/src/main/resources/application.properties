spring.application.name=web-agrogestion
server.port=${PORT:8080}

# Variables de entorno: en local se leen del archivo .env (raiz del proyecto), en Render/Docker del entorno.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Direcciones de los microservicios ---
servicios.empleados.url=${MS_EMPLEADOS_URL:http://localhost:8081}
servicios.insumos.url=${MS_INSUMOS_URL:http://localhost:8082}
servicios.cosechas.url=${MS_COSECHAS_URL:http://localhost:8083}

# Muestra las cuentas de demostracion en la pantalla de login (apagar en produccion)
tomatoes.mostrar-demo=${MOSTRAR_DEMO:false}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.jackson.time-zone=America/Bogota
server.servlet.session.timeout=8h
server.forward-headers-strategy=framework
server.compression.enabled=true
server.error.whitelabel.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.com.tomatoes=INFO
