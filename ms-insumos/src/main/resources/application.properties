spring.application.name=ms-insumos
server.port=${PORT:8082}

# Variables de entorno: en local se leen del archivo .env (raiz del proyecto), en Render/Docker del entorno.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- MongoDB Atlas (una base de datos por microservicio) ---
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:agro_insumos}
spring.data.mongodb.auto-index-creation=true

# --- Seguridad JWT (la clave debe ser la MISMA en todos los servicios) ---
tomatoes.jwt.secret=${JWT_SECRET:tomatoes-clave-solo-para-desarrollo-local-cambiar-en-produccion-2026}
tomatoes.jwt.expiracion-horas=8

# --- Documentacion OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.time-zone=America/Bogota
logging.level.com.tomatoes=INFO
